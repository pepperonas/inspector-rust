# Vendored from OpenScreen v2.1.2 (commit bfd5bc32), crates/compositor — MIT.
# Every change against the upstream manifest is listed in VENDORED.md.
#
# Inspector Rust builds this crate ONLY for macOS on Apple Silicon. On every other
# target (Linux CI, Windows, Intel macOS) it is an empty library with no runtime
# dependencies, so `cargo test --workspace` stays green without an ffmpeg tree.
[package]
name = "openscreen-compositor"
version = "2.1.2"
edition = "2021"
license = "MIT"
publish = false
description = "OpenScreen's native compositor (Metal + VideoToolbox via LGPL ffmpeg), vendored for Inspector Rust's record editor."

[lib]
name = "openscreen_compositor"
path = "src/lib.rs"

# Build dependencies are gated on the HOST (cargo evaluates build-dependency cfgs
# against the host). Only a macOS host can produce the macOS target anyway.
[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.70"
cc = "1"

# No `segmentation` feature: the ONNX webcam mask is not used, and its `ort`
# 2.0.0-rc.13 requirement would bump Inspector Rust's own `ort` (rc.12) through
# version unification. `segmentation.rs` still compiles; its entry points fail
# gracefully without the feature.
[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("segmentation"))', 'cfg(openscreen_ffmpeg)'] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Runtime shader effects (`shader_fx`): naga to MSL. Pinned at 24 upstream.
naga = { version = "24", features = ["wgsl-in", "hlsl-out", "msl-out"] }
metal = "0.29"
objc = "0.2"
block = "0.1"
core-foundation = "0.9"
