[package]
name = "transcribe-protocol"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Wire protocol and session file format between Inspector Rust and its `ir-transcribe` helper"

# Platform-free on purpose: the app (every OS) reads session folders without
# linking whisper.cpp; only the helper links the engine.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
