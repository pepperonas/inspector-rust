[package]
name = "transcribe-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Live transcription engine: capture, VAD, segmentation, local agreement, echo gate, crash-safe writer, whisper.cpp"

[dependencies]
transcribe-protocol = { path = "../transcribe-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
flate2 = "1"
hound = "3.5"
rubato = "0.16"
base64 = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
ureq = { workspace = true, features = ["tls"] }
tracing = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
cpal = "0.15"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSError"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "SCStream", "SCShareableContent", "SCError", "dispatch2"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMFormatDescription"] }

[dev-dependencies]
tempfile = "3"
