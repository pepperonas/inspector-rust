[package]
name = "transcribe-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Live transcription engine: capture, VAD, segmentation, local agreement, echo gate, crash-safe writer, whisper.cpp"

[dependencies]
transcribe-protocol = { path = "../transcribe-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
flate2 = "1"
hound = "3.5"
sha2 = { workspace = true }
dirs = { workspace = true }
ureq = { workspace = true, features = ["tls"] }
tracing = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tempfile = "3"
