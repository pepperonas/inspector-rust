name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libudev-dev \
            libinput-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        # IR_SKIP_BADGES=1 makes the `posttest` hook (update-badges.mjs) a
        # no-op. Without it, `pnpm test` would run `cargo test --workspace` to
        # recount Rust tests — which needs the GTK/glib system libs this
        # frontend-only runner doesn't install (glib-2.0 not found → red CI).
        # Badges are a local-dev convenience; CI never commits them, and the
        # Rust job below runs the workspace tests with the deps installed.
        run: IR_SKIP_BADGES=1 pnpm test

      - name: Lint
        run: pnpm lint
